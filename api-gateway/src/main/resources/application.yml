spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: true

    gateway:
      default-filters:
        - AddRequestHeader=Authorization, $request.header.Authorization

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
