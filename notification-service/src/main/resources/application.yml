spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888"

server:
  port: 8087

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true